<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>{{ app_name }}</span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="/projects" class="{{ 'is-active' if active == 'projects' else '' }}">项目</a>
      <a href="/analyze" class="{{ 'is-active' if active == 'analyze' else '' }}">分析</a>
      <a href="/tasks" class="{{ 'is-active' if active == 'tasks' else '' }}">任务</a>
      <a href="/settings" class="{{ 'is-active' if active == 'settings' else '' }}">设置</a>
      <a href="/landmarks" class="{{ 'is-active' if active == 'landmarks' else '' }}">关键点</a>
    </nav>
    <div class="health" id="health" data-state="checking">
      <span class="health-dot" aria-hidden="true"></span>
      <span class="health-text">本地服务</span>
    </div>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
